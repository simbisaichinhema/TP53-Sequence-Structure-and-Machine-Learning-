name: tp53-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - biopython
  - pandas
  - numpy
  - scikit-learn
  - matplotlib
  - pyyaml
  - joblib
  - scipy
  # Optional boosters used by scripts/machine_learning/benchmark_models.py.
  # The benchmark skips any model whose package is missing.
  - xgboost
  - lightgbm
  - catboost
